# Deploys the static site to GitHub Pages.
# Repo settings → Pages → Source must be set to "GitHub Actions" for this to publish.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "CNAME"
      - "robots.txt"
      - "sitemap.xml"
      - "og-image.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Syntax-check inline script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and check the page script
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > page.js
          test -s page.js
          node --check page.js
      - name: Confirm CNAME is intact
        run: test "$(cat CNAME)" = "whistle.uap-facts.com"

  deploy:
    name: Publish
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html CNAME robots.txt sitemap.xml og-image.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
